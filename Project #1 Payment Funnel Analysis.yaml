  - cellType: TEXT
    cellId: 019c3d76-74a4-7110-ad14-9804c2b688c8 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      richText:
        - type: paragraph
          children:
            - text: "The payment funnel analysis reveals that the largest drop-off occurs at the very beginning of the payment journey. "
        - type: paragraph
          children:
            - text: "Approximately "
            - bold: true
              text: 40.68% of subscriptions (24 users)
            - text: " never initiate the payment process, making this the most significant leakage point in the funnel. "
        - type: paragraph
          children:
            - text: This indicates substantial friction prior to or at payment entry, potentially driven by unclear pricing, weak call-to-action placement, lack of urgency, or user hesitation before opening the payment widget.
        - type: paragraph
          children:
            - text: "Overall paid conversion is low, with only "
            - bold: true
              text: 20.34% of subscriptions (12 users)
            - text: " successfully completing payment. "
        - type: paragraph
          children:
            - text: "As users progress deeper into the funnel, participation steadily declines: "
            - bold: true
              text: 11.86%
            - text: " open the payment widget, "
            - bold: true
              text: 8.47%
            - text: " submit payment, and "
            - bold: true
              text: 8.47%
            - text: " reach vendor-side payment success."
        - type: paragraph
          children:
            - text: "Error-related failures account for a smaller but meaningful portion of drop-offs. "
        - type: paragraph
          children:
            - bold: true
              text: 3.39%
            - text: " of subscriptions encounter user submission errors, while another "
            - bold: true
              text: 3.39%
            - text: " fail during third-party payment processing. "
        - type: paragraph
          children:
            - text: Although these issues impact conversion, they are not the primary drivers of funnel attrition.
        - type: paragraph
          children:
            - text: "Overall, the analysis indicates that the greatest opportunity to improve paid conversion lies in increasing early-stage engagement and motivating users to initiate the payment process. "
        - type: paragraph
          children:
            - text: Additional gains can be achieved by reducing user submission errors and improving the reliability of third-party payment processing.
  - cellType: TEXT
    cellId: 019c4c28-b176-777c-9675-58fd60dfa105 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      richText:
        - type: paragraph
          children:
            - text: "⚡️ Determine a way to track subscriptions throughout the payment funnel, identify friction points, and measure payment success. "
        - type: h3
          children:
            - text: Tracking Subscriptions Through the Payment Funnel
        - type: paragraph
          children:
            - text: "To track subscriptions across the payment funnel, the "
            - code: true
              text: payment_status_log
            - text: " table was used as the event-level source of truth. Funnel stages were reconstructed dynamically by:"
        - type: ul
          children:
            - type: li
              children:
                - type: lic
                  children:
                    - text: "Calculating the "
                    - bold: true
                      text: maximum status reached
                    - text: " per subscription to determine the deepest funnel stage achieved."
            - type: li
              children:
                - type: lic
                  children:
                    - text: "Using "
                    - bold: true
                      text: ROW_NUMBER() ordered by movement_date DESC
                    - text: " to derive the most recent (current) status."
            - type: li
              children:
                - type: lic
                  children:
                    - text: Mapping status combinations into standardized funnel stages (Not Started → Complete).
        - type: paragraph
          children:
            - text: "This approach accounts for:"
        - type: ul
          children:
            - type: li
              children:
                - type: lic
                  children:
                    - text: Subscriptions that encounter errors and recover.
            - type: li
              children:
                - type: lic
                  children:
                    - text: Subscriptions that move backward in the workflow.
            - type: li
              children:
                - type: lic
                  children:
                    - text: Subscriptions that abandon the process and remain in their last recorded status.
        - type: h3
          children:
            - text: Key Friction Points
        - type: ul
          children:
            - type: li
              children:
                - type: lic
                  children:
                    - bold: true
                      text: 33–38%
                    - text: " of subscriptions never initiate payment (largest drop-off)."
            - type: li
              children:
                - type: lic
                  children:
                    - bold: true
                      text: 20–25%
                    - text: " successfully reach the Complete stage."
            - type: li
              children:
                - type: lic
                  children:
                    - bold: true
                      text: 16.95%
                    - text: " experience at least one payment error."
            - type: li
              children:
                - type: lic
                  children:
                    - text: "Vendor processing errors account for up to "
                    - bold: true
                      text: 8.33%
                    - text: " of subscriptions (2024)."
        - type: paragraph
          children:
            - text: The primary friction point is payment initiation, followed by checkout reliability.
  - cellType: TEXT
    cellId: 019c4c29-be0d-777c-9676-bc205c57f2f2 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
