  - cellType: TEXT
    cellId: 019c3d76-74a4-7110-ad14-53bfe0ba80ba # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      richText:
        - type: paragraph
          children:
            - text: This query analyzes subscription progression through the payment funnel by calculating the final payment stage reached by each subscription and aggregating results by year.
        - type: paragraph
          children:
            - text: "For each subscription, the maximum payment status recorded in the payment portal is identified, representing the furthest point reached in the payment journey (e.g., payment portal opened, payment submitted, payment completed, or terminated due to an error). "
        - type: paragraph
          children:
            - text: "Subscriptions are then mapped to a single funnel stage based on this maximum status, with subscriptions that never entered the payment portal labeled as "
            - bold: true
              text: “Payment Not Started.”
        - type: paragraph
          children:
            - text: The results are aggregated annually to calculate both the count and percentage of subscriptions in each funnel stage.
  - cellType: SQL
    cellId: 019c3d76-74c3-7110-ad17-67f5d5fe4f6d # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      source: |
        with max_status_reached as (
            select
                subscription_id,
                max(status_id) as max_status
            from
                public.payment_status_log
            group by
                subscription_id
        ),
        payment_funnel_stages as (
            select
                subs.subscription_id,
                date_trunc('year', order_date) as order_year,
                current_payment_status,
                max_status,
                case
                    when max_status = 1 then 'Payment Widget Opened'
                    when max_status = 2 then 'Payment Entered'
                    when max_status = 3 and current_payment_status = 0 then 'User Error with Payment Submission'
                    when max_status = 3 and current_payment_status != 0 then 'Payment Submitted'
                    when max_status = 4 and current_payment_status = 0 then 'Payment processing error with Vendor'
                    when max_status = 4 and current_payment_status != 0 then 'Payment Success w/ Vendor'
                    when max_status = 5 then 'Complete'
                    when max_status is null then 'User has not started the payment process'
                end as payment_funnel_stage
            from
                subscriptions subs
            left join
                max_status_reached m
                on subs.subscription_id = m.subscription_id
        )

        select
            payment_funnel_stage,
            order_year,
            count(*) as num_subs,
            round(
                count(*) * 100.0
                / sum(count(*)) over (partition by order_year),
                2
            ) as pct_subscriptions
        from
            payment_funnel_stages
        group by
            payment_funnel_stage,
            order_year
        order by
            order_year desc;
      dataFrameCell: false
      dataConnectionId: 34b92293-aaf9-485d-acf7-db69412e953d
