                    - bold: true
                      text: "Happy Path:"
                    - text: " The subscription progresses through all payment stages without encountering any errors and successfully reaches the completion status."
            - type: li
              children:
                - type: lic
                  children:
                    - bold: true
                      text: "User Error at Payment Submission:"
                    - text: " The subscription enters the payment flow but encounters an error during payment submission, likely due to invalid or incomplete user input."
            - type: li
              children:
                - type: lic
                  children:
                    - bold: true
                      text: "Third-Party Processing Error:"
                    - text: " The subscription reaches the external payment processing stage, but the system does not receive a successful confirmation from the payment vendor, resulting in a failed conversion."
            - type: li
              children:
                - type: lic
                  children:
                    - bold: true
                      text: "Payment Flow Not Started:"
                    - text: " The subscription never enters the payment portal and therefore has no recorded payment events."
  - cellType: TEXT
    cellId: 019c3d76-74a4-7110-ad14-4fd27ecc1a48 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      richText:
        - type: paragraph
          children:
            - text: To identify friction points within the payment funnel, subscriptions are categorized based on the furthest payment stage they reach.
        - type: paragraph
          children:
            - text: "This query calculates the maximum "
            - code: true
              text: status_id
            - text: " for each "
            - code: true
              text: subscription_id
            - text: " in the "
            - code: true
              text: payment_status_log
            - text: " table. "
        - type: paragraph
          children:
            - text: Because payment status IDs follow a chronological order (1–5), the maximum status represents the furthest point reached in the payment workflow for each subscription.
  - cellType: SQL
    cellId: 019c3d76-74c3-7110-ad17-5a5894ace896 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
