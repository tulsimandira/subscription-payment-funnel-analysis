    cellId: 019c3d76-74a4-7110-ad14-934b870e4055 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      richText:
        - type: paragraph
          children:
            - text: "This query constructs a payment funnel by assigning each subscription to a single final payment stage using payment status logs and subscription-level payment outcomes. "
        - type: paragraph
          children:
            - text: The funnel reflects the furthest point each user reached in the payment process, adjusted by the most recent payment status to distinguish between successful payments, errors, and drop-offs.
        - type: paragraph
          children:
            - text: "Using payment status history, the query identifies both the maximum payment stage reached by each subscription and the most recent payment status via a window function. "
        - type: paragraph
          children:
            - text: "These signals are combined with subscription data to classify subscriptions into mutually exclusive funnel stages such as payment initiation, submission, vendor processing, completion, or error states. "
        - type: paragraph
          children:
            - text: Each subscription is counted exactly once to avoid duplication across stages.
  - cellType: SQL
    cellId: 019c3d76-74c3-7110-ad17-8e3b6cb0937d # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      source: |
        with max_status_reached as (
            select 
                subscription_id,
                max(status_id) as max_status
            from 
                public.payment_status_log
            group by
                subscription_id
        ),

        subs_current_status as (
            select
                subscription_id,
                status_id as current_status,
                movement_date,
                row_number() over (
                    partition by subscription_id 
                    order by movement_date desc
                ) as most_recent_status
            from
                public.payment_status_log
            qualify
                most_recent_status = 1
        ),

        payment_funnel_stages as (
            select
                subs.subscription_id,
                date_trunc('year', subs.order_date) as order_year,
                curr.current_status,
                m.max_status,
                case 
                    when m.max_status = 1 then 'Payment Widget Opened'
                    when m.max_status = 2 then 'Payment Entered'
                    when m.max_status = 3 and subs.current_payment_status = 0 
                        then 'User Error with Payment Submission'
                    when m.max_status = 3 and subs.current_payment_status != 0 
                        then 'Payment Submitted'
                    when m.max_status = 4 and subs.current_payment_status = 0 
                        then 'Payment Processing Error with Vendor'
                    when m.max_status = 4 and subs.current_payment_status != 0 
                        then 'Payment Success w/ Vendor'
                    when m.max_status = 5 then 'Complete'
                    when m.max_status is null 
                        then 'User Has Not Started Payment Process'
                end as payment_funnel_stage
            from
                public.subscriptions subs
            left join
                max_status_reached m
                on subs.subscription_id = m.subscription_id
            left join 
                subs_current_status curr
                on subs.subscription_id = curr.subscription_id
        )

        select 
            payment_funnel_stage,
            count(*) as num_subs,
            round(
                100.0 * count(*) / sum(count(*)) over (),
                2
            ) as pct_of_subs
        from 
            payment_funnel_stages
        group by
            payment_funnel_stage
        order by
            pct_of_subs desc;
      dataFrameCell: false
      dataConnectionId: 34b92293-aaf9-485d-acf7-db69412e953d
