    cellId: 019c3d76-74a4-7110-ad14-76f49d7ebb44 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      richText:
        - type: paragraph
          children:
            - text: "This analysis calculates the payment error rate by identifying subscriptions that encountered at least one error during the payment process. "
        - type: paragraph
          children:
            - text: "A common table expression (CTE) is used to extract distinct "
            - code: true
              text: subscription_id
            - text: "s from the "
            - code: true
              text: payment_status_log
            - text: "where "
            - code: true
              text: status_id = 0
            - text: ", representing an error state."
        - type: paragraph
          children:
            - text: "Applying "
            - code: true
              text: DISTINCT
            - text: " ensures that subscriptions with multiple error events are counted only once. "
        - type: paragraph
          children:
            - text: The error rate is then calculated as the percentage of subscriptions with at least one recorded error relative to the total number of subscriptions in the system.
  - cellType: SQL
    cellId: 019c3d76-74c3-7110-ad17-7429ab7f49d4 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      source: |-
        with error_subs as (
        select 
           distinct subscription_id
        from
           public.payment_status_log
        where   
           status_id = 0
        )
        select 
           count(err.subscription_id) * 100 / count(subs.subscription_id) as perc_subs_hit_error
        from
           public.subscriptions subs
        left join
           error_subs err
           on subs.subscription_id = err.subscription_id
