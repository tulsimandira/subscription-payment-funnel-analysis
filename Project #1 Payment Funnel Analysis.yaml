  - cellType: TEXT
    cellId: 019c3d76-74a4-7110-ad14-3980b61aa388 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      richText:
        - type: p
          children:
            - text: "Based on exploratory analysis of payment status events, subscription journeys can be grouped into the following categories:"
        - type: ul
          children:
            - type: li
              children:
                - type: lic
